<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MetaBid</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f6f8;
            color: #222222;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

        .page-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* MetaBid header */

        .site-header {
            padding: 10px 0 20px;
            text-align: center;
        }

        .site-logo {
            display: block !important;
            width: 55px !important;
            max-width: 55px !important;
            height: 55px !important;
            max-height: 55px !important;
            margin: 0 auto 6px !important;
            object-fit: contain !important;
        }

        .site-title {
            margin: 0;
            color: #1f4e79;
            font-size: 30px;
            line-height: 1.2;
        }

        .site-subtitle {
            margin: 3px 0 0;
            color: #666666;
            font-size: 14px;
        }

        /* Inventory table */

        .table-container {
            overflow-x: auto;
            border: 1px solid #d6dbe1;
            border-radius: 6px;
            background-color: #ffffff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        table {
            width: 100%;
            min-width: 800px;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            padding: 11px 10px;
            background-color: #245680;
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            text-align: left;
        }

        td {
            height: 76px;
            padding: 8px 10px;
            border-bottom: 1px solid #dddddd;
            color: #222222;
            font-size: 14px;
            line-height: 1.4;
            text-align: left;
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr:nth-child(even) {
            background-color: #f7f9fb;
        }

        tbody tr:hover {
            background-color: #eaf3fb;
        }

        /* Column sizes */

        .id-column {
            width: 70px;
            text-align: center;
        }

        .photo-column {
            width: 100px;
            text-align: center;
        }

        .description-column {
            width: 35%;
        }

        .weight-column {
            width: 120px;
        }

        .price-column {
            width: 140px;
        }

        .vendor-column {
            width: 210px;
        }

        /* Inventory photos */

        .item-image {
            display: block !important;
            width: 55px !important;
            max-width: 55px !important;
            height: 55px !important;
            max-height: 55px !important;
            margin: 0 auto !important;
            border-radius: 4px;
            object-fit: contain !important;
        }

        .loading-message,
        .empty-message,
        .error-message {
            height: auto;
            padding: 25px;
            text-align: center;
        }

        .loading-message,
        .empty-message {
            color: #666666;
        }

        .error-message {
            color: #a4262c;
        }

        @media screen and (max-width: 700px) {
            body {
                padding: 10px;
            }

            .site-logo {
                width: 45px !important;
                max-width: 45px !important;
                height: 45px !important;
                max-height: 45px !important;
            }

            .site-title {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <main class="page-container">

        <header class="site-header">

            ./images/Ferrous Logo target.jpg

            <h1 class="site-title">MetaBid</h1>

            <p class="site-subtitle">
                Asset Marketplace
            </p>

        </header>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th class="id-column">ID</th>
                        <th class="photo-column">Photo</th>
                        <th class="description-column">Description</th>
                        <th class="weight-column">Weight</th>
                        <th class="price-column">Bid Price</th>
                        <th class="vendor-column">Vendor Name</th>
                    </tr>
                </thead>

                <tbody id="inventory">

                    <tr>
                        <td
                            colspan="6"
                            class="loading-message"
                        >
                            Loading inventory...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </main>

    <script>
        function safeText(value) {
            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {
                return "";
            }

            return String(value);
        }

        function formatNumber(value) {
            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {
                return "";
            }

            const number = Number(
                String(value).replace(/[$,]/g, "")
            );

            if (Number.isNaN(number)) {
                return safeText(value);
            }

            return number.toLocaleString("en-US");
        }

        function formatCurrency(value) {
            if (
                value === null ||
                value === undefined ||
                value === ""
            ) {
                return "";
            }

            const number = Number(
                String(value).replace(/[$,]/g, "")
            );

            if (Number.isNaN(number)) {
                return safeText(value);
            }

            return number.toLocaleString("en-US", {
                style: "currency",
                currency: "USD",
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            });
        }

        fetch("./data/items.json")
            .then(function (response) {

                if (!response.ok) {
                    throw new Error(
                        "Could not load items.json. HTTP status " +
                        response.status
                    );
                }

                return response.json();
            })
            .then(function (items) {

                const inventory =
                    document.getElementById("inventory");

                if (
                    !Array.isArray(items) ||
                    items.length === 0
                ) {
                    inventory.innerHTML = `
                        <tr>
                            <td
                                colspan="6"
                                class="empty-message"
                            >
                                No MetaBid items are currently available.
                            </td>
                        </tr>
                    `;

                    return;
                }

                let rows = "";

                items.forEach(function (item) {

                    let photo = "No photo";

                    if (item.image) {
                        photo = `
                            <img
                                src="${safeText(item.image)}"
                                alt="Photo for item ${safeText(item.id)}"
