<!DOCTYPE html>
<html>
<head>
    <title>MetaBid</title>

    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f5f6f8;
            margin:0;
            padding:20px;
        }

        .container{
            max-width:1200px;
            margin:auto;
        }

        .header{
            text-align:center;
            margin-bottom:20px;
        }

        .logo{
            width:60px;
            height:60px;
            object-fit:contain;
            display:block;
            margin:auto;
        }

        h1{
            margin:5px 0 0 0;
            color:#1f4e79;
        }

        .subtitle{
            color:#666;
            margin-top:5px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 2px 5px rgba(0,0,0,.15);
        }

        th{
            background:#245680;
            color:white;
            text-align:left;
            padding:12px;
        }

        td{
            padding:10px;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f0f7ff;
        }

        .thumb{
            width:60px;
            height:60px;
            object-fit:contain;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <img
            src="images/Ferrous Logo target.jpg"
            class="logo"
            alt="MetaBid Logo">

        <h1>MetaBid</h1    </div>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Photo</th>
                <th>Description</th>
                <th>Weight</th>
                <th>Bid Price</th>
                <th>Vendor Name</th>
            </tr>
        </thead>

        <tbody id="inventory">

            <tr>
                <td colspan="6">
                    Loading inventory...
                </td>
            </tr>

        </tbody>

    </table>

</div>

<script>

fetch('data/items.json')

.then(response => response.json())

.then(data => {

    let html = '';

    data.forEach(item => {

        html += `

        <tr>

            <td>${item.id}</td>

            <td>
                <img
                    src="${item.image}"
                    class="thumb">
            </td>

            <td>${item.description}</td>

            <td>${item.weight}</td>

            <td>$${Number(item.bidPrice).toLocaleString()}</td>

            <td>${item.vendorName}</td>

        </tr>

        `;

    });

    document.getElementById('inventory').innerHTML = html;

})

.catch(error => {

    document.getElementById('inventory').innerHTML =

        `<tr>
            <td colspan="6">
                Error: ${error}
            </td>
        </tr>`;

});

</script>

</body>
</html>
