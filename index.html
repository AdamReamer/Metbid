<!DOCTYPE html>
<html>

<head>

    <title>MetaBid</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 15px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        th {
            background-color: #1f4e79;
            color: white;
            padding: 10px;
            text-align: left;
        }

        td {
            border: 1px solid #ddd;
            padding: 8px;
            vertical-align: middle;
        }

        tr:nth-child(even) {
            background-color: #f5f5f5;
        }

        tr:hover {
            background-color: #e8f2ff;
        }

        .item-image {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        .logo {
            width: 75px;
            height: auto;
        }

    </style>

</head>

<body>

    <div style="text-align:center; margin-bottom:20px;">

        <img src="images/Ferrous Logo target.jpg"
   tyle="
            margin:5px 0 0 0;
            color:#1f4e79;
            font-size:32px;">
            MetaBid
        </h1>

        <p style="
            margin:0;
            color:#666;">
            Asset Marketplace
        </p>

    </div>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Photo</th>
                <th>Description</th>
                <th>Weight</th>
                <th>Bid Price</th>
                <th>Vendor Name</th>
            </tr>
        </thead>

        <tbody id="inventory">
        </tbody>

    </table>

<script>

fetch('data/items.json')
.then(response => response.json())
.then(data => {

    let html = '';

    data.forEach(item => {

        html += `
        <tr>

            <td>${item.id}</td>

            <td>
                <img src="${item.image}"
                     class="item-image">
            </td>

            <td>${item.description}</td>

            <td>${item.weight}</td>

            <td>$${item.bidPrice}</td>

            <td>${item.vendorName}</td>

        </tr>
        `;

    });

    document.getElementById('inventory').innerHTML = html;

});

</script>

</body>

</html>
